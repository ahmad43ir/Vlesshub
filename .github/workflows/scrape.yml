# ============================================================
# 🕵️ vless-scraper — manual run-once job (GitHub Actions)
# ============================================================
# Started on demand from the Telegram bot with /scrape
# (workflow_dispatch), OR by an hourly schedule tick that is gated
# on the bot's ⏱ Auto-scrape scheduler (scraper_config keys written
# by the panel: scrape_schedule_enabled / scrape_schedule_hours).
# A scheduled run only proceeds when an interval has elapsed; if the
# scheduler is stopped, the tick exits in ~30 seconds without
# installing anything or touching Telegram.
#
# Manual runs (bot /scrape) pass chat_id as an input so the workflow
# can report the result back to that chat; scheduled runs just log.
#
# The scraper connects to Telegram through the MTProto proxy pool
# stored in Supabase (scraper_proxies, managed with /addproxy),
# scans the configured VLESS channels (last 3 messages each, draining
# up to 30/channel when a backlog exists so no config is skipped),
# and POSTs extracted links to the vless-ingestion-api webhook.
# It also scrapes PROXY_CHANNELS (last 1 message each) to refresh
# the MTProto proxy pool, tests them, and stores working proxies.
# A "could not connect" failure usually means no working proxy —
# send one to the bot with /addproxy and run /scrape again.
#
# Required repository secrets (Settings → Secrets and
# variables → Actions):
#   API_ID, API_HASH, TELEGRAM_SESSION,
#   WEBHOOK_URL, WEBHOOK_API_KEY, SUPABASE_URL, SUPABASE_KEY
# Optional:
#   CHANNELS        — comma-separated VLESS channels; only needed when the
#                     channel list is NOT stored in Supabase (bot /addchannel
#                     → scraper_config.vless_channels takes precedence)
#   PROXY_CHANNELS — channels that post MTProto proxies (pool seed)
#   MT_PROXY_HOST, MT_PROXY_PORT, MT_PROXY_SECRET
#                   — optional bootstrap proxy: used when the pool has no
#                     verified (last_ok) proxy left, so a run can still
#                     connect, re-test the pool and heal it. Send one with
#                     the bot /addproxy instead and it lands in the pool.
#   BOT_TOKEN      — only needed for the Telegram result report
# ============================================================

name: vless-scraper

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram chat_id to send the run report to (set by the bot /scrape)'
        required: false
        type: string
  schedule:
    # Hourly tick — a cheap gate step decides whether the scraper
    # actually runs (see "Schedule gate" below). Hourly (not finer)
    # keeps the Actions budget safe even with the gate overhead.
    - cron: '7 * * * *'

# Prevent overlapping runs from the same account (queue, don't cancel).
concurrency:
  group: vless-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub does not allow the `secrets` context inside `if:` conditions,
    # so bridge the checks into job-level env booleans ("true"/"false").
    env:
      # CHANNELS may be empty when the channel list lives in Supabase
      # (bot /addchannel → scraper_config.vless_channels) — the scraper
      # itself falls back to CHANNELS only when storage has no list.
      TG_READY: ${{ secrets.TELEGRAM_SESSION != '' && secrets.API_ID != '' && secrets.API_HASH != '' }}
      BOT_TOKEN_SET: ${{ secrets.BOT_TOKEN != '' }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      # ── Schedule gate (scheduled ticks only) ──────────────────
      # Reads the bot ⏱ panel's config from scraper_config and sets
      # SCHEDULE_DUE=false to skip the run when it isn't due:
      #   scrape_schedule_enabled = "true"  → scheduler running
      #   scrape_schedule_hours   = "6"|"12"|"24"
      #   scrape_schedule_last    = ISO timestamp of the last SUCCESSFUL run
      # The fire time is stamped by the report step only after a successful
      # run, so failed scheduled runs retry on the next hourly tick instead
      # of waiting a full interval. Fail-safe: if Supabase is unreachable
      # the tick skips (never auto-runs blind).
      - name: Schedule gate (skip if auto-scrape not due)
        if: ${{ github.event_name == 'schedule' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          sb_url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          sb_key = os.environ.get("SUPABASE_KEY", "")

          def skip(reason):
              print(f"Skipping scheduled run: {reason}")
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("SCHEDULE_DUE=false\n")

          def cfg(key):
              url = f"{sb_url}/rest/v1/scraper_config?select=value&key=eq.{urllib.parse.quote(key)}"
              req = urllib.request.Request(
                  url, headers={"apikey": sb_key, "Authorization": f"Bearer {sb_key}"}
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  rows = json.loads(r.read())
              return rows[0]["value"] if rows else None

          try:
              if not sb_url or not sb_key:
                  skip("SUPABASE_URL / SUPABASE_KEY not set")
                  raise SystemExit(0)
              if cfg("scrape_schedule_enabled") != "true":
                  skip("auto-scrape scheduler is stopped")
                  raise SystemExit(0)
              hours = int(cfg("scrape_schedule_hours") or 12)
              last = cfg("scrape_schedule_last")
              now = datetime.now(timezone.utc)
              due = True
              if last:
                  t = datetime.fromisoformat(str(last).replace("Z", "+00:00"))
                  due = (now - t).total_seconds() >= hours * 3600
              if not due:
                  skip(f"next auto-scrape is every {hours}h (last: {last})")
                  raise SystemExit(0)
              print(f"Auto-scrape due (every {hours}h, last: {last or 'never'}) — proceeding.")
          except SystemExit:
              raise
          except Exception as e:
              skip(f"could not check schedule ({e})")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: ${{ env.SCHEDULE_DUE != 'false' }}
        run: pip install -r requirements.txt

      # Skips gracefully until the Telegram credentials are added
      # (avoids noisy failing runs). Output is teed to run.log so
      # the report step can send a summary to the bot chat.
      - name: Run scraper (fetch recent messages)
        if: ${{ env.TG_READY == 'true' && env.SCHEDULE_DUE != 'false' }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          CHANNELS: ${{ secrets.CHANNELS }}
          PROXY_CHANNELS: ${{ secrets.PROXY_CHANNELS }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RUN_ONCE: '1'
          RUN_ONCE_MAX_MESSAGES: '3'
          # Cap total reads per channel per run (top batch + catch-up drain);
          # a busy backlog drains across runs instead of being skipped.
          RUN_ONCE_MAX_MESSAGES_TOTAL: '30'
          # Bootstrap proxy (optional): seeds the pool and is used as the
          # connection when no verified proxy exists. Prevents the
          # "No proxy available" chicken-and-egg after the pool dies out.
          MT_PROXY_HOST: ${{ secrets.MT_PROXY_HOST }}
          MT_PROXY_PORT: ${{ secrets.MT_PROXY_PORT }}
          MT_PROXY_SECRET: ${{ secrets.MT_PROXY_SECRET }}
        # pipefail: the pipeline must fail when python does (not just when tee
        # fails), so a scraper error still marks the job as failed.
        run: set -o pipefail; python main.py 2>&1 | tee run.log

      - name: No Telegram credentials yet
        if: ${{ env.TG_READY != 'true' && env.SCHEDULE_DUE != 'false' }}
        run: echo "Telegram credentials not configured yet — add API_ID, API_HASH and TELEGRAM_SESSION as repository secrets (CHANNELS is optional when the bot /addchannel list is set)." > run.log

      # Report the result back to the bot chat. Sent from the BOT
      # account (BOT_TOKEN), never the user account. Runs even when
      # the scraper step fails. Each report replaces (deletes) the
      # previous one (tracked in scraper_config) so reports don't pile
      # up in the chat.
      - name: Report result to Telegram
        # Manual runs report to the chat_id input; scheduled runs report
        # to the admin chat saved by the bot on the last manual /scrape
        # (scraper_config key scrape_report_chat_id).
        if: ${{ always() && env.BOT_TOKEN_SET == 'true' && (inputs.chat_id != '' || env.SCHEDULE_DUE != 'false') }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          log_text = ""
          try:
              with open("run.log", encoding="utf-8", errors="replace") as f:
                  log_text = f.read()
          except Exception:
              pass

          token = os.environ["BOT_TOKEN"]
          chat = os.environ.get("CHAT_ID", "")
          sb_url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          sb_key = os.environ.get("SUPABASE_KEY", "")
          report_key = f"scrape_report_message_id:{chat}"

          # Scheduled runs have no chat_id input — fall back to the admin
          # chat saved by the bot on the last manual /scrape.
          if not chat and sb_url and sb_key:
              try:
                  req = urllib.request.Request(
                      sb_url + "/rest/v1/scraper_config?select=value&key=eq.scrape_report_chat_id",
                      headers={"apikey": sb_key, "Authorization": "Bearer " + sb_key},
                  )
                  with urllib.request.urlopen(req, timeout=20) as r:
                      rows = json.loads(r.read())
                  if rows and rows[0].get("value"):
                      chat = str(rows[0]["value"])
                      report_key = f"scrape_report_message_id:{chat}"
              except Exception as e:
                  print(f"report chat fallback failed: {e}")
          if not chat:
              print("No chat to report to (no chat_id input, no saved scrape_report_chat_id).")
              raise SystemExit(0)


          def api(method, body):
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=data,
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"report {method} failed: {e}")
                  return None


          def sb_request(path, method="GET", body=None):
              if not sb_url or not sb_key:
                  return None
              req = urllib.request.Request(
                  sb_url + "/rest/v1/" + path,
                  method=method,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={
                      "apikey": sb_key,
                      "Authorization": f"Bearer {sb_key}",
                      "Content-Type": "application/json",
                      "Prefer": "resolution=merge-duplicates",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"report sb {method} {path} failed: {e}")
                  return None


          def send(text):
              # Replace the previous scrape report (if any) so reports
              # don't pile up in the chat.
              prev = (
                  sb_request("scraper_config?select=value&key=eq." + urllib.parse.quote(report_key))
                  if sb_url and sb_key else None
              )
              if prev and prev[0] and prev[0].get("value"):
                  api("deleteMessage", {"chat_id": chat, "message_id": int(prev[0]["value"])})
              res = api("sendMessage", {"chat_id": chat, "text": text, "parse_mode": "Markdown"})
              mid = (res or {}).get("result", {}).get("message_id")
              if mid and sb_url and sb_key:
                  sb_request(
                      "scraper_config?on_conflict=key",
                      method="POST",
                      body={"key": report_key, "value": str(mid)},
                  )


          if "Run-once summary:" in log_text:
              m = re.search(
                  r"Run-once summary: (\d+) channel\(s\), (\d+) message\(s\) seen, (\d+) with links, (\d+) link\(s\) found",
                  log_text,
              )
              if m:
                  channels, seen, withlinks, links = m.groups()
                  send(
                      "🤖 *Scraper run finished*\n\n"
                      f"📡 Channels scanned: {channels}\n"
                      f"💬 Messages seen: {seen}\n"
                      f"🔗 Messages with links: {withlinks}\n"
                      f"✅ Links found: {links}"
                  )
              else:
                  send("🤖 *Scraper run finished* (details in the Actions log)")
              # Success: stamp the schedule so the next auto-run waits a full
              # interval. (Failed runs skip this → the next hourly tick retries.)
              if sb_url and sb_key:
                  stamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                  sb_request(
                      "scraper_config?on_conflict=key",
                      method="POST",
                      body={"key": "scrape_schedule_last", "value": stamp},
                  )
          elif "No proxy available" in log_text:
              send(
                  "❌ *Scraper run failed — no working proxy.*\n\n"
                  "Send a working MTProto proxy with `/addproxy` "
                  "(e.g. `/addproxy tg://proxy?server=..&port=..&secret=..`), then run `/scrape` again."
              )
          elif "Could not connect" in log_text:
              m = re.search(r"Could not connect: (.+)", log_text)
              err = (m.group(1).strip() if m else "unknown error").replace("\n", " ")
              send(
                  f"❌ *Scraper run failed — could not connect to Telegram.*\n"
                  f"`{err}`\n\n"
                  "Send a working proxy with `/addproxy`, then run `/scrape` again."
              )
          else:
              tail = [ln for ln in log_text.splitlines() if ln.strip()][-6:]
              send("⚠️ *Scraper run finished with issues.*\n```\n" + "\n".join(tail) + "\n```")
          PY
