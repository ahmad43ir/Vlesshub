// ── Version gate ──
async function checkVersion() {

    const r = await fetch(`${SB}/rest/v1/app_config?id=eq.1&select=*`, { headers });
    const [cfg] = await r.json();
    if (!cfg) return;

// ── Tab switching ──
function loadTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  const content = document.getElementById('content');
  content.innerHTML = '<div class="center"><div class="spinner"></div></div>';

  else if (tab === 'links') loadServers();

// ── MTProto ──
async function loadProxies() {
  try {
    const r = await fetch(`${PROXY_API}/proxies`);
    const data = await r.json();
    proxies = data.proxies || [];
    renderProxies();
  } catch(e) {

  }
}

function renderProxies() {
  const c = document.getElementById('content');
  if (!proxies.length) { c.innerHTML = '<div class="center"><p class="empty">No proxies available</p></div>'; return; }
  let html = `<div class="toolbar"><span style="font-size:13px;color:var(--text2)">${proxies.length} proxies</span><div class="spacer"></div><button class="chip" onclick="maybeShowAd(()=>loadProxies())">↻ Refresh</button></div>`;
  proxies.forEach(p => {

    const label = p.source || p.host;
    html += `<div class="card"><div class="card-title">${esc(label)}</div><div class="card-meta">${esc(p.host)}:${p.port}</div><div class="actions">
      <button class="btn btn-neon" onclick="maybeShowAd(()=>copyText('${jsStr(p.link)}','Telegram proxy copied'))">📋 Copy</button>

// ── Links (servers) ──
async function loadServers() {

function renderServers() {

    const meta = [s.source_channel && `source: @${s.source_channel}`, s.type, `${s.flag||''} ${s.country||''}`.trim()].filter(Boolean).join(' · ');
    const time = s.created_at ? formatTime(s.created_at) : '';
    html += `<div class="card"><div class="card-title">${esc(s.name||'Server')}</div><div class="card-meta">${esc(meta)}${time ? ' · 🕗 '+esc(time) : ''}</div><div class="actions">

function showMoreLinks() { visibleLinks += 10; renderServers(); }

// ── Files ──
async function loadFiles() {
  try {
    const r = await fetch(`${SB}/rest/v1/vpn_files?select=*&order=uploaded_at.desc`, { headers });
    files = (await r.json()).filter(f => !hiddenFiles.includes(f.id));

function renderFiles() {
  const c = document.getElementById('content');
  if (!files.length) { c.innerHTML = '<div class="center"><p class="empty">No files yet</p></div>'; return; }
  const shown = files.slice(0, visibleFiles);
  let html = `<div class="toolbar"><span style="font-size:13px;color:var(--text2)">${files.length} files</span><div class="spacer"></div><button class="chip" onclick="maybeShowAd(()=>loadFiles())">↻ Refresh</button></div>`;

    html += `<div class="card" style="display:flex;gap:12px;align-items:center">

      </div>
      <button class="btn btn-neon" onclick="maybeShowAd(()=>downloadFile('${f.id}','${jsStr(f.filename||'file')}'))">⬇️</button>

  });
  if (visibleFiles < files.length) html += `<button class="more" onclick="maybeShowAd(()=>showMoreFiles())">More</button>`;
  c.innerHTML = html;
}

async function downloadFile(id, filename) {
  toast('Downloading...');
  try {
    const r = await fetch(`${SB}/rest/v1/vpn_files?id=eq.${id}&select=content`, { headers });
    if (!r.ok) { toast('Download failed'); return; }
    const [row] = await r.json();
    if (!row?.content) { toast('File not found'); return; }
    // PostgREST serves bytea as "\x<hex>". The bots store the file's
    // base64 text into the bytea column (saveVpnFile), so the hex bytes
    // are an ASCII base64 string: strip \x -> hex-decode -> base64-decode
    // -> original file bytes.
    let hex = row.content;
    if (hex.startsWith('\\x')) hex = hex.slice(2);
    const hexBytes = new Uint8Array(hex.length / 2);
    for (let i = 0; i < hexBytes.length; i++) {
      hexBytes[i] = parseInt(hex.substr(i * 2, 2), 16);
    }
    let decoded = '';
    for (let i = 0; i < hexBytes.length; i++) decoded += String.fromCharCode(hexBytes[i]);
    let arr;
    if (/^[A-Za-z0-9+/]*={0,2}$/.test(decoded) && decoded.length % 4 === 0) {
      // Looks like the stored base64 text — decode it back to the raw file.
      const bin = atob(decoded);
      arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    } else {
      // Raw binary was stored directly — use the hex-decoded bytes as-is.
      arr = hexBytes;
    }
    // A concrete MIME type stops Chrome from sniffing the content and
    // appending an extension (.npvt -> .npvt.txt / .npvt.xml).
    const blob = new Blob([arr], { type: blobTypeFor(filename) });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(`${filename} downloaded`);
  } catch(e) { toast('Download failed'); }
}

function blobTypeFor(filename) {
  const ext = (filename.split('.').pop() || '').toLowerCase();
  const map = {
    txt: 'text/plain', log: 'text/plain', json: 'application/json', xml: 'application/xml',
    yaml: 'text/yaml', yml: 'text/yaml', csv: 'text/csv',
    pdf: 'application/pdf', zip: 'application/zip', apk: 'application/vnd.android.package-archive',
    jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp',
  };
  return map[ext] || 'application/octet-stream';
}

// ── Helpers ──
// ── Yektanet ad ──
function loadYektanetAd() {
  // Ad slot placeholder. The Yektanet superscript served on this page is
  // the analytics/retargeting SDK only — it does NOT serve display ads, so
  // nothing renders here until a real web publisher spot script (Yektanet
  // publishers panel or another network) is wired in.
  const container = document.getElementById('adContainer');
  if (container.querySelector('[data-pos-id]')) return; // already loaded
  const slot = document.createElement('div');
  slot.setAttribute('data-pos-id', AD_POS_ID);
  slot.style.cssText = 'width:100%;min-height:250px;display:flex;align-items:center;justify-content:center;';
  container.appendChild(slot);
}

function maybeShowAd(callback) {
  actionCount++;
  localStorage.setItem('vh_ad_count', actionCount);
  // Show the interstitial on every 3rd action.
  // The overlay will show Adsterra content when the script is wired in.
  if (actionCount >= 3) {
    actionCount = 0;
    localStorage.setItem('vh_ad_count', '0');
    showAd(callback);
  } else {
    callback();
  }
}

function showAd(callback) {
  const overlay = document.getElementById('adOverlay');
  overlay.classList.add('show');
  window._adCallback = callback;
  // Auto-close after 5s if no interaction
  setTimeout(() => { if (overlay.classList.contains('show')) closeAd(); }, 8000);
}

function closeAd() {
  document.getElementById('adOverlay').classList.remove('show');
  const cb = window._adCallback;
  window._adCallback = null;
  if (cb) cb();
}

function copyText(text, msg) {
  const ok = () => toast(msg);
  const fail = () => toast('Copy failed');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(ok).catch(() => (legacyCopy(text) ? ok() : fail()));
  } else {
    legacyCopy(text) ? ok() : fail();
  }
}

// Fallback for Android WebViews / insecure contexts where the
// asynchronous Clipboard API is unavailable or rejected.
function legacyCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

function shareText(text, title) {
  if (navigator.share) navigator.share({ title, text });
  else copyText(text, 'Copied — share not supported');
}

function openConfig(raw) {
  // Try common VPN clients
  const schemes = ['v2rayng://install-config','nekobox://install-config','hiddify://import'];
  let opened = false;
  for (const s of schemes) {
    try { window.location.href = s + '?url=' + encodeURIComponent(raw); opened = true; break; } catch(e) {}
  }
  if (!opened) copyText(raw, 'Config copied — import it in your client');
}

function openTelegram(link) {
  window.location.href = link;
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes >= 1048576) return (bytes/1048576).toFixed(1) + ' MB';
  if (bytes >= 1024) return (bytes/1024).toFixed(1) + ' KB';
  return bytes + ' B';
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// Escape for a single-quoted JS string literal that ends up inside a
// double-quoted HTML attribute (inline onclick handlers). esc() is NOT
// enough there: &#39; decodes back to ' inside the attribute and breaks
// the JS string.
function jsStr(s) {
  return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');
}

function fileExt(name) {
  return ((name||'').split('.').pop()||'').toUpperCase().slice(0,4);
}

function fileProtocol(f) {
  if (f && f.mime_type) {
    const t = f.mime_type.replace(/^(application|text)\//, '').trim();
    if (t && t !== 'octet-stream') return t;
  }
  return fileExt(f && f.filename);
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

async function installApp() {
  if (!window._deferredPrompt) return;
  window._deferredPrompt.prompt();
  const { outcome } = await window._deferredPrompt.userChoice;
  if (outcome === 'accepted') document.getElementById('installBanner').classList.remove('show');
  window._deferredPrompt = null;
}
